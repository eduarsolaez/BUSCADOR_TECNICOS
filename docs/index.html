<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Transformadores</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>

    <div class="container">
        <div class="search-box">
            <h1>Buscador de Transformadores</h1>
            <p>Ingrese Código trafo, Matrícula CT, Matrícula trafo, QR, NIC o Medidor</p>
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Ej: TR12345..." onkeypress="handleEnter(event)">
                <button onclick="performSearch()">Buscar</button>
            </div>
            <p id="statusMsg" class="status-msg"></p>
            <div id="bankAlert" class="bank-alert" style="display: none;">POSIBLES TRANSFORMADORES EN BANCO</div>
        </div>

        <div id="resultContainer" class="result-container" style="display: none;">
            <!-- Resultados dinámicos se insertarán aquí desde script.js -->
        </div>
    </div>

    <div id="mapModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cercanía de Transformadores (300m)</h2>
                <span class="close-modal" onclick="closeMap()">&times;</span>
            </div>
            <div id="map"></div>
            <div class="map-legend">
                <div class="legend-item"><span class="dot target-dot"></span> Objetivo</div>
                <div class="legend-item"><span class="dot bank-dot"></span> Mismo CT (Banco)</div>
                <div class="legend-item"><span class="dot regular-dot"></span> Otro cercano</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
